<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Bhoomi</title>
    <link rel="stylesheet" href="../assets/css/landing.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .auth-header p {
            color: var(--text-gray);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-gray);
            font-size: 0.95rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--primary-black);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-gold);
        }
        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent-gold);
            color: var(--primary-black);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-gray);
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: var(--accent-gold);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
                    <div class="logo-icon"></div>
                    <span class="logo-text">BHOOMI</span>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to access your dashboard</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>User Role</label>
                    <select id="roleSelect">
                        <option value="citizen">Citizen</option>
                        <option value="authority">Local Authority</option>
                        <option value="government">Government HQ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Aadhaar / Registered Mobile / Email</label>
                    <input type="text" placeholder="Enter credential" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Forgot password? <a href="forgot-password.html">Reset here</a></p>
                <p style="margin-top: 0.5rem;">Don't have an account? <a href="register.html">Register</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('roleSelect').value;
            if (role === 'citizen') window.location.href = '../pages/citizen/dashboard.html';
            else if (role === 'authority') window.location.href = '../pages/authority/dashboard.html';
            else if (role === 'government') window.location.href = '../pages/government/dashboard.html';
        });
    </script>
</body>
</html>
