<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - B.H.U.M.I</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <span class="logo-text">B.H.U.M.I</span>
                </div>
                <h1>Digital Land Registry System</h1>
                <p>Securing land rights through blockchain technology</p>
            </div>
            <div class="auth-illustration">
                <div class="floating-element element-1">🏠</div>
                <div class="floating-element element-2">📄</div>
                <div class="floating-element element-3">🔒</div>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to access your account</p>
                </div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="userType">Login As</label>
                        <select id="userType" required>
                            <option value="">Select User Type</option>
                            <option value="citizen">Citizen</option>
                            <option value="authority">Local Authority</option>
                            <option value="government">Government Official</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your.email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <span class="toggle-password" onclick="togglePassword()">👁️</span>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-btn">Sign In</button>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="social-btn google">
                            <span>🔍</span> Continue with Google
                        </button>
                        <button type="button" class="social-btn aadhaar">
                            <span>🆔</span> Login with Aadhaar
                        </button>
                    </div>

                    <div class="auth-footer">
                        <p>Don't have an account? <a href="register.html">Sign Up</a></p>
                    </div>
                </form>
            </div>

            <div class="auth-info">
                <p>🔒 Secure Login • 🌐 Government of India Initiative</p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById('password');
            password.type = password.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const userType = document.getElementById('userType').value;

            if (!userType) {
                alert('Please select user type');
                return;
            }

            // Redirect based on user type
            if (userType === 'citizen') {
                window.location.href = '../pages/citizen/dashboard.html';
            } else if (userType === 'authority') {
                window.location.href = '../pages/authority/dashboard.html';
            } else if (userType === 'government') {
                window.location.href = '../pages/government/dashboard.html';
            }
        });
    </script>
</body>
</html>
