<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Bhoomi</title>
    <link rel="stylesheet" href="../assets/css/landing.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .auth-header p {
            color: var(--text-gray);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-gray);
            font-size: 0.95rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--primary-black);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-gold);
        }
        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent-gold);
            color: var(--primary-black);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-gray);
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: var(--accent-gold);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
                    <div class="logo-icon"></div>
                    <span class="logo-text">BHOOMI</span>
                </div>
                <h1>Create Account</h1>
                <p>Register for Blockchain Land Portal</p>
            </div>

            <form id="regForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Rajesh Kumar Sharma" required>
                </div>
                <div class="form-group">
                    <label>Aadhaar Number</label>
                    <input type="text" placeholder="12-digit Aadhaar Number" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" placeholder="+91 98765 43210" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="auth-btn">Complete Onboarding</button>
            </form>

            <div class="auth-footer">
                <p>Already registered? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registration Successful! Redirecting to Citizen Dashboard...');
            window.location.href = '../pages/citizen/dashboard.html';
        });
    </script>
</body>
</html>
