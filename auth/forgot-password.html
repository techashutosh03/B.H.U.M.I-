<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - B.H.U.M.I</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <div class="logo">
                    
                    <span class="logo-text">B.H.U.M.I</span>
                </div>
                <h1>Reset Your Password</h1>
                <p>We'll send you instructions to reset your password</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Forgot Password?</h2>
                    <p>Enter your email to receive reset instructions</p>
                </div>

                <form class="auth-form" id="forgotForm">
                    <div class="form-group">
                        <label for="resetEmail">Email Address</label>
                        <input type="email" id="resetEmail" placeholder="your.email@example.com" required>
                    </div>

                    <button type="submit" class="auth-btn">Send Reset Link</button>

                    <div class="auth-footer">
                        <p><a href="login.html">← Back to Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Password reset link has been sent to your email!');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>
</body>
</html>
