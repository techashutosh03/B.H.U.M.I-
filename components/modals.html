<div id="commonModal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 9999; align-items: center; justify-content: center;">
    <div class="modal-box" style="background: var(--card-bg, #1f1f1f); border: 1px solid var(--accent-gold, #d4af37); border-radius: 12px; padding: 2rem; max-width: 500px; width: 90%; color: #fff;">
        <h3 id="modalTitle" style="margin-bottom: 1rem; color: var(--accent-gold, #d4af37);">Notification</h3>
        <p id="modalBody" style="color: #a0a0a0; margin-bottom: 1.5rem;">Modal content goes here.</p>
        <button onclick="document.getElementById('commonModal').style.display='none'" style="padding: 0.6rem 1.5rem; background: var(--accent-gold, #d4af37); border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Close</button>
    </div>
</div>
