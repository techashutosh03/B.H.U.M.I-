<!-- ── Navbar Styles (self-contained) ── -->

<!-- ── Navbar Script (self-contained) ── -->
<script>
(function () {
    const navbar    = document.getElementById('bhNavbar');
    const hamburger = document.getElementById('bhNavHamburger');
    const navLinks  = document.getElementById('bhNavLinks');

    // Scroll effect
    window.addEventListener('scroll', () => {
        if (navbar) {
            navbar.classList.toggle('scrolled', window.scrollY > 40);
        }
    });

    // Hamburger toggle
    if (hamburger && navLinks) {
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('open');
            navLinks.classList.toggle('open');
        });

        // Close on link click
        navLinks.querySelectorAll('.bh-nav-link').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('open');
                navLinks.classList.remove('open');
            });
        });
    }

    // Active link on scroll
    const sections = document.querySelectorAll('section[id]');
    if (sections.length > 0) {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.querySelectorAll('.bh-nav-link').forEach(l => {
                        l.classList.remove('active');
                        if (l.getAttribute('href')?.includes(entry.target.id)) {
                            l.classList.add('active');
                        }
                    });
                }
            });
        }, { threshold: 0.4 });

        sections.forEach(s => observer.observe(s));
    }
})();
</script>
