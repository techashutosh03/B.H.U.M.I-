<!--
    ── HOW TO USE ──────────────────────────────────────────────
    Option A (JS injection — recommended):
    ────────────────────────────────────────────────────────────

    In your dashboard HTML, place:
        <div id="sidebarMount"></div>

    In your JS:
        const template = document.getElementById('citizenSidebarTemplate');
        const clone    = template.content.cloneNode(true);
        document.getElementById('sidebarMount').appendChild(clone);

    Option B (Direct copy):
    ────────────────────────────────────────────────────────────
    Copy the <aside> block for the relevant portal directly
    into each dashboard HTML page. All dashboard pages in this
    project already have the sidebar inline — this file serves
    as the single source of truth / reference.
    ────────────────────────────────────────────────────────────
-->
